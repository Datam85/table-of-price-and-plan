<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }
      .pricing-container{
        width: 100%;
        height: auto;
        display: flex;
        justify-content: space-around;
        margin-top: 100px;
        gap: 50px;
      }
      .pricing-container .pricing-plan{
        background-color: #f2f2f2;
        text-align: center;
        flex-grow: 1;
        width: 360px;
        padding: 10px;
      }
      .pricing-container .pricing-plan .plan-title, .pricing-container .pricing-plan .plan-price{
        font-weight: bold;
      }
      .pricing-container .pricing-plan .plan-title{
        font-size: 25px;
      }
      .pricing-container .pricing-plan .plan-price{
        font-size: 40px;
        margin: 20px 0;
      }
      .pricing-container .pricing-plan ul li{
        list-style: none;
        margin-bottom: 30px;
      }
      .pricing-container .pricing-plan button{
        background-color: #ff6600;
        padding: 10px;
        color: #fff;
        font-size: 13px;
        border-radius: 5px;
        border: none;
      }
      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container{
          flex-direction: column;
          align-items: center;
          gap: 0;
        }
        .pricing-container .pricing-plan{
          margin-bottom: 50px;
          flex-grow: 0;

        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan">
        <div class="plan-title">Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan">
        <div class="plan-title">Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
